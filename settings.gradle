// All resolution goes through the Nexus group `maven-public`, which proxies both
// Maven Central and the Gradle Plugin Portal. Declaring the public repositories
// directly gets builds rate-limited (HTTP 429) on the shared CI runners.
pluginManagement {
    repositories {
        maven {
            url = 'https://repository.axelor.com/nexus/repository/maven-public/'
            mavenContent {
                releasesOnly()
            }
        }
    }
    plugins {
        id 'com.axelor.app' version aopVersion
    }
}

dependencyResolutionManagement {
    repositories {
        maven {
            url = 'https://repository.axelor.com/nexus/repository/maven-public/'
        }
    }
}

buildscript {
  repositories {
      // A `buildscript` block inside an `apply from:` script escapes the
      // repositories declared in settings.gradle, so the Nexus group has to be
      // repeated here: gradlePluginPortal() would hit the rate-limited portal.
      maven { url 'https://repository.axelor.com/nexus/repository/maven-public/' }
  }
  dependencies {
    classpath 'com.diffplug.spotless:spotless-plugin-gradle:7.2.1'
  }
}

apply plugin: com.diffplug.gradle.spotless.SpotlessPlugin

spotless {
  enforceCheck = false

  format 'misc', {
    target fileTree(projectDir) {
      include '**/.gitignore'
      include '**/*.gradle'
      include '**/*.adoc'
      include '**/*.sh'
      //include '**/*.html'
      include '**/*.js'
      include '**/*.css'
      include '**/*.xsd'
      exclude '**/webapp/**'
      exclude '**/.gradle/**'
      exclude '**/build/**'
    }
    leadingTabsToSpaces(2)
    trimTrailingWhitespace()
    endWithNewline()
  }

  format 'markdown', {
    target fileTree(projectDir) {
      include '**/*.md'
      exclude 'CHANGELOG.md'
      exclude '**/build/**'
    }
    leadingTabsToSpaces(2)
    endWithNewline()
  }

  format 'xml', {
    target fileTree(projectDir) {
      include '**/*.xml'
      exclude '**/build/**'
      exclude '**/.gradle/**'
      exclude '.idea/**'
    }
    eclipseWtp('xml').configFile("${project.projectDir}/gradle/spotless.xml.prefs")
    trimTrailingWhitespace()
  }

  java {
    target fileTree(projectDir) {
      include '**/*.java'
      exclude '**/build/**'
    }
    googleJavaFormat()
  }
}

tasks.register('formatCode') {
  description 'Add license and format code.'
  group 'Axelor'
  dependsOn 'licenseFormat', 'spotlessApply'
}

build.dependsOn 'spotlessApply'
